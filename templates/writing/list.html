{% extends "base.html" %}

{% block title %}Writing — RDMSR{% endblock title %}

{% block content %}

<h2>All Writing</h2>

<table>
    <thead>
        <tr>
            <th>Date</th>
            <th>Title</th>
            <th class="col-link">Link</th>
        </tr>
    </thead>
    <tbody>
        {% for post in section.pages %}
        <tr>
            <td>{{ post.date }}</td>
            <td><a href="{{ post.permalink }}">{{ post.title }}</a></td>
            <td class="col-link"><a href="{{ post.permalink }}" class="link">View</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock content %}
